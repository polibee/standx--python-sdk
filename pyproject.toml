[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "standx-python-sdk"
version = "0.1.0"
description = "Typed Python SDK for the documented StandX Perps API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["PyNaCl>=1.5", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["standx_sdk"]

[tool.build]
wheel = true
